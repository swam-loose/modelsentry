name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      MODELSENTRY_ENVIRONMENT: testing
      MODELSENTRY_DATABASE_URL: sqlite+pysqlite:///./ci-unused.db
      PYTHONUTF8: "1"
    steps:
      - name: Check out source without persistent Git credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and development tools
        run: python -m pip install --editable ".[dev]"
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Lint
        run: python -m ruff check app tests migrations scripts
      - name: Check formatting
        run: python -m ruff format --check app tests migrations scripts
      - name: Test with a coverage gate
        run: python -m pytest tests -p no:cacheprovider --cov=app --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml
      - name: Verify migration upgrade, drift check, and downgrade
        run: python scripts/check_release.py migrations
      - name: Save test and coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-evidence-${{ matrix.os }}
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build and inspect distributions
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source without persistent Git credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build and verification tools
        run: python -m pip install --editable ".[dev]"
      - name: Build source distribution and wheel from that source distribution
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check --strict dist/*
      - name: Inspect archive contents and version consistency
        run: python scripts/check_release.py artifacts dist
      - name: Smoke-test the installed wheel outside the checkout
        run: python scripts/check_release.py smoke dist
      - name: Save candidate distributions without publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: modelsentry-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
