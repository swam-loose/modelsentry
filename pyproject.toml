[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "modelsentry"
version = "0.1.0"
description = "Reproducible evaluation and governance for AI model releases."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.17,<2.0",
    "fastapi>=0.147,<1.0",
    "pydantic-settings>=2.16,<3.0",
    "sqlalchemy>=2.1,<3.0",
    "uvicorn>=0.54,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.15,<3.0",
    "pytest>=9.1,<10.0",
    "pytest-cov>=7.1,<8.0",
    "ruff>=0.16,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"